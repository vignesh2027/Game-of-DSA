name: Build and Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages:    write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # ─── Job 1: Build WebAssembly ─────────────────────────────────────────────
  build:
    runs-on: ubuntu-22.04
    name: Build (Emscripten → WebAssembly)

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache Emscripten
        uses: actions/cache@v4
        with:
          path: ~/emsdk
          key: emsdk-3.1.50

      - name: Install Emscripten SDK
        run: |
          if [ ! -d ~/emsdk ]; then
            git clone https://github.com/emscripten-core/emsdk.git ~/emsdk
          fi
          cd ~/emsdk
          ./emsdk install 3.1.50
          ./emsdk activate 3.1.50

      - name: Cache CMake build artifacts
        uses: actions/cache@v4
        with:
          path: build-web
          key: cmake-web-${{ hashFiles('CMakeLists.txt', 'src/**') }}
          restore-keys: cmake-web-

      - name: Configure CMake (Emscripten)
        run: |
          source ~/emsdk/emsdk_env.sh
          emcmake cmake -B build-web \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE=~/emsdk/upstream/emscripten/cmake/Modules/Platform/Emscripten.cmake

      - name: Build
        run: |
          source ~/emsdk/emsdk_env.sh
          cmake --build build-web --config Release --parallel 4

      - name: Prepare deployment directory
        run: |
          mkdir -p docs
          # Copy built web files
          cp build-web/index.html  docs/index.html  || true
          cp build-web/index.js    docs/index.js    || true
          cp build-web/index.wasm  docs/index.wasm  || true
          cp build-web/index.data  docs/index.data  || true

          # Copy assets
          if [ -d assets ]; then cp -r assets docs/; fi

          # Fallback index.html if build failed partially
          if [ ! -f docs/index.html ]; then
            cp web/shell.html docs/index.html
          fi

          echo "Deployment directory contents:"
          ls -la docs/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/

  # ─── Job 2: Deploy to GitHub Pages ────────────────────────────────────────
  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-22.04

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # ─── Job 3: Desktop build check ───────────────────────────────────────────
  build-desktop:
    name: Desktop Build Check (Linux)
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y \
            build-essential cmake git \
            libx11-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxi-dev libxext-dev \
            libgl1-mesa-dev libglu1-mesa-dev \
            libasound2-dev libpulse-dev

      - name: Configure CMake
        run: cmake -B build-desktop -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build-desktop --parallel 4

      - name: Check binary exists
        run: |
          if [ -f build-desktop/GameOfDSA ]; then
            echo "✅ Desktop build succeeded"
            ls -lh build-desktop/GameOfDSA
          else
            echo "❌ Binary not found"
            exit 1
          fi

  # ─── Job 4: macOS build check ─────────────────────────────────────────────
  build-macos:
    name: Desktop Build Check (macOS)
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew install cmake

      - name: Configure CMake
        run: cmake -B build-macos -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build-macos --parallel 4

      - name: Check binary
        run: |
          if [ -f build-macos/GameOfDSA ]; then
            echo "✅ macOS build succeeded"
          else
            echo "❌ Binary not found"
            exit 1
          fi
